name: Nightly Tests

on:
  schedule:
    # Run every night at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  PACKAGE_NAME: 'oxid-solution-catalysts/paypal-module'
  CLIENT_PACKAGE_NAME: 'oxid-solution-catalysts/paypal-client'
  CLIENT_REPO_NAME: 'https://github.com/OXID-eSales/paypal-client.git'
  MODULE_PATH: 'osc/paypal'
  SONARCLOUD_ORGANIZATION: 'oxid-esales'
  SONARCLOUD_PROJECT_KEY: 'OXID-eSales_module-paypal_checkout'
  TEMPLATE_ENGINE: 'twig'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set branch-specific matrix
        id: set-matrix
        run: |
          # Define branch-specific configurations
          matrix='{
            "include": [
              {
                "branch": "b-6.5.x",
                "shop_branch": "b-6.5.x",
                "php": ["7.4", "8.0", "8.1"],
                "mysql": ["5.7", "8.0"],
                "datagen_branch": "b-6.5.x",
                "theme": "flow",
                "module_settings": "MODULE_SETTINGS_OXID6",
                "supported_features": ["unit_tests"]
              },
              {
                "branch": "b-7.0.x",
                "shop_branch": "b-7.0.x",
                "php": ["8.0", "8.1", "8.2"],
                "mysql": ["5.7", "8.0", "8.1"],
                "datagen_branch": "b-7.0.x",
                "theme": "apex",
                "module_settings": "MODULE_SETTINGS_OXID7",
                "supported_features": ["unit_tests", "playwright"]
              },
              {
                "branch": "b-7.1.x",
                "shop_branch": "b-7.1.x",
                "php": ["8.1", "8.2", "8.3"],
                "mysql": ["8.0", "8.1"],
                "datagen_branch": "b-7.1.x",
                "theme": "apex",
                "module_settings": "MODULE_SETTINGS_OXID7",
                "supported_features": ["unit_tests", "playwright"]
              },
              {
                "branch": "b-7.2.x",
                "shop_branch": "b-7.2.x",
                "php": ["8.1", "8.2", "8.3"],
                "mysql": ["8.0", "8.1"],
                "datagen_branch": "b-7.2.x",
                "theme": "apex",
                "module_settings": "MODULE_SETTINGS_OXID7",
                "supported_features": ["unit_tests", "playwright"]
              },
              {
                "branch": "b-7.3.x",
                "shop_branch": "b-7.3.x",
                "php": ["8.2", "8.3"],
                "mysql": ["8.0", "8.1"],
                "datagen_branch": "b-7.3.x",
                "theme": "apex",
                "module_settings": "MODULE_SETTINGS_OXID7",
                "supported_features": ["unit_tests", "playwright"]
              },
              {
                "branch": "b-8.0.x",
                "shop_branch": "b-8.0.x",
                "php": ["8.2", "8.3"],
                "mysql": ["8.0", "8.1"],
                "datagen_branch": "b-8.0.x",
                "theme": "apex",
                "module_settings": "MODULE_SETTINGS_OXID8",
                "supported_features": ["unit_tests", "playwright"]
              }
            ]
          }'
          
          # Expand the matrix to create individual jobs for each PHP/MySQL combination
          expanded_matrix='{"include": []}'
          
          for branch_config in $(echo $matrix | jq -r '.include[] | @base64'); do
            branch_data=$(echo $branch_config | base64 --decode)
            branch=$(echo $branch_data | jq -r '.branch')
            shop_branch=$(echo $branch_data | jq -r '.shop_branch')
            datagen_branch=$(echo $branch_data | jq -r '.datagen_branch')
            theme=$(echo $branch_data | jq -r '.theme')
            module_settings=$(echo $branch_data | jq -r '.module_settings')
            supported_features=$(echo $branch_data | jq -r '.supported_features')
          
            for php in $(echo $branch_data | jq -r '.php[]'); do
              for mysql in $(echo $branch_data | jq -r '.mysql[]'); do
                job_config=$(jq -n \
                  --arg branch "$branch" \
                  --arg shop_branch "$shop_branch" \
                  --arg php "$php" \
                  --arg mysql "$mysql" \
                  --arg datagen_branch "$datagen_branch" \
                  --arg theme "$theme" \
                  --arg module_settings "$module_settings" \
                  --argjson supported_features "$supported_features" \
                  '{
                    branch: $branch,
                    shop_branch: $shop_branch,
                    php: $php,
                    mysql: $mysql,
                    datagen_branch: $datagen_branch,
                    theme: $theme,
                    module_settings: $module_settings,
                    supported_features: $supported_features
                  }')
          
                expanded_matrix=$(echo $expanded_matrix | jq ".include += [$job_config]")
              done
            done
          done
          
          echo "matrix=$expanded_matrix" >> $GITHUB_OUTPUT

  install_shop_with_module:
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Print run parameters
        run: |
          echo "Running nightly test for:"
          echo "  Branch: ${{ matrix.branch }}"
          echo "  Shop Branch: ${{ matrix.shop_branch }}"
          echo "  PHP version: ${{ matrix.php }}"
          echo "  MySQL version: ${{ matrix.mysql }}"
          echo "  Theme: ${{ matrix.theme }}"
          echo "  Template engine: ${{ env.TEMPLATE_ENGINE }}"
          echo "  Supported features: ${{ join(matrix.supported_features, ', ') }}"
          echo "  Trigger event: ${{ github.event_name }}"

      - name: Cleanup workspace
        run: |
          ls -la ./
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          ls -la ./

      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        run: git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch ${{ matrix.shop_branch }} --single-branch source

      - name: Download datagen
        run: |
          git clone --depth 1 https://${{ secrets.DATGEN_GH_TOKEN }}@github.com/OXID-eSales/datagen.git source/extensions/datagen --branch=${{ matrix.datagen_branch }}

      - name: Cache current installation
        uses: actions/cache@v4
        with:
          path: |
            ./*
          key: nightly-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          perl -pi\
            -e 's#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php }}#g;'\
            -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=${{ matrix.mysql }}#g;"\
            .env
          perl -pi\
            -e 's#display_errors =.*#display_errors = false#g;'\
            -e 's#error_reporting = .*#error_reporting = E_ALL ^ E_WARNING ^ E_DEPRECATED#g;'\
            -e 'print "xdebug.max_nesting_level=1000\nxdebug.mode=coverage\n\n"'\
            containers/php/custom.ini
          perl -pi\
            -e 's#/var/www/#/var/www/source/#g;'\
            containers/httpd/project.conf

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization "\(.*\)" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess
          sed -i -e 's/<dbHost>/mysql/'\
                 -e 's/<dbUser>/root/'\
                 -e 's/<dbName>/example/'\
                 -e 's/<dbPwd>/root/'\
                 -e 's/<dbPort>/3306/'\
                 -e 's/<sShopURL>/https:\/\/${{ secrets.NGROK_CUSTOM_DOMAIN }}\//'\
                 -e 's/<sShopDir>/\/var\/www\/source\//'\
                 -e 's/<sCompileDir>/\/var\/www\/source\/tmp\//'\
              source/source/config.inc.php

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Checkout current module
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: source/test-module

      - name: Install module
        run: |
          docker compose exec -T \
            php composer config repositories.${{ env.PACKAGE_NAME }} \
            --json '{"type":"path", "url":"./test-module", "options": {"symlink": true}}'
          docker compose exec -T \
            php composer require ${{ env.PACKAGE_NAME }}:* --no-interaction --no-update

      - name: Install demodata
        run: |
          docker compose exec -T \
            php composer config repositories.oxid-esales/oxideshop-demodata-ce \
            --json '{"type":"git", "url":"https://github.com/OXID-eSales/oxideshop_demodata_ce"}'
          docker compose exec -T php composer require oxid-esales/oxideshop-demodata-ce:dev-master --no-update
          docker compose exec -T php composer require oxid-esales/${{ matrix.theme }}-theme:dev-${{ matrix.shop_branch }} --no-update

      - name: Install datagen
        run: |
          docker compose exec -T \
          php composer config repositories.oxid-esales/datagen \
          --json '{"type":"path", "url":"./extensions/datagen", "options": { "symlink": true } }'
          docker compose exec -T php composer require oxid-esales/datagen:dev-${{ matrix.datagen_branch }} --no-update

      - name: Install dependencies and reset shop
        run: |
          docker compose exec -T php composer update --no-interaction
          docker compose exec -T php bin/oe-console oe:database:reset \
            --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
          docker compose exec -T php bin/oe-console oe:setup:demodata
          docker compose exec -T php bin/oe-console oe:theme:activate ${{ matrix.theme }}
          docker compose exec -T php bin/oe-console oe:module:activate osc_paypal
          ls -la
          ls -la source

      - name: Put module settings
        continue-on-error: true
        run: |
          mkdir -p source/var/configuration/environment/shops/1/modules
          echo "${{ secrets[matrix.module_settings] }}" > source/var/configuration/environment/shops/1/modules/osc_paypal.yaml
          echo "${{ secrets.MODULE_ENV }}" > source/vendor/${{ env.PACKAGE_NAME }}/tests/.env
          docker compose exec -T php php bin/oe-console oe:module:activate osc_paypal

      - name: Show docker log
        if: always()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down
          sleep 2

      - name: Upload configuration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nightly-Configs-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}
          path: |
            docker-compose.yml
            source/composer.json
            source/composer.lock
            source/config.inc.php
            source/var/configuration/shops/1/modules/osc_paypal.yaml
            data/php/logs/error_log.txt

  unit_tests:
    needs: [setup-matrix, install_shop_with_module]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    # Only run unit tests for configurations that support them
    if: contains(matrix.supported_features, 'unit_tests')
    steps:
      - name: Load current installation from cache
        uses: actions/cache@v4
        with:
          path: |
            ./*
          key: nightly-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            nightly-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Install testing dependencies
        run: |
          docker compose exec -T php composer require symfony/dotenv --no-update --dev
          docker compose exec -T php composer update

      - name: Run tests
        run: |
          docker compose exec -T -e XDEBUG_MODE=coverage php vendor/bin/phpunit \
            -c /var/www/test-module/tests/phpunit.xml \
            --bootstrap=/var/www/source/bootstrap.php \
            --verbose

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nightly-TestsLog-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}
          path: |
            source/coverage.xml
            source/phpunit.xml
            source/source/log/oxideshop.log
            source/data/php/logs/error_log.txt

  playwright:
    needs: [setup-matrix, install_shop_with_module]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    # Only run playwright tests for configurations that support them
    if: contains(matrix.supported_features, 'playwright')
    steps:
      - name: Load current installation from cache
        uses: actions/cache@v4
        with:
          path: |
            ./*
          key: nightly-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            nightly-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}-${{ env.TEMPLATE_ENGINE }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Set up ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null && \
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list && \
          sudo apt-get update && sudo apt-get install ngrok

      - name: Create .env file
        working-directory: source/test-module/tests/e2e/playwright
        run: |
          echo "${{ secrets.PLAYWRIGHT_TEST_ENV }}" > .env
          echo "Created .env file for ${{ matrix.branch }}"

      - name: Load .env file into GitHub environment
        working-directory: source/test-module/tests/e2e/playwright
        run: |
          if [ -f .env ]; then
            while IFS='=' read -r key value || [ -n "$key" ]; do
              if [[ ! "$key" =~ ^# && -n "$key" ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < .env
            echo ".env variables successfully loaded into GitHub environment."
          else
            echo ".env file not found. Skipping..."
          fi

      - name: Validate Environment Variables
        run: |
          if [[ -z "$BASE_URL" || -z "$PAYPAL_EMAIL" || -z "$PAYPAL_PASSWORD" || -z "$SHOP_USER_EMAIL" || -z "$SHOP_USER_PASSWORD" ]]; then
            echo "Error: Required environment variables not found. Exiting."
            exit 1
          fi
          echo "Environment variables successfully loaded for ${{ matrix.branch }}"

      - name: Start ngrok with custom domain and keepalive
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          nohup ngrok http --hostname=${{ secrets.NGROK_CUSTOM_DOMAIN }} --log=stdout 80 > ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "NGROK_PID=$NGROK_PID" >> $GITHUB_ENV
          sleep 10
          
          if ! kill -0 $NGROK_PID 2>/dev/null; then
            echo "Ngrok failed to start properly"
            cat ngrok.log
            exit 1
          fi
          echo "Ngrok started successfully for ${{ matrix.branch }} with PID $NGROK_PID"

      - name: Test ngrok tunnel connection
        run: |
          for i in {1..5}; do
            echo "Testing ngrok connection attempt $i/5 for ${{ matrix.branch }}"
            if curl -I https://${{ secrets.NGROK_CUSTOM_DOMAIN }} --max-time 10; then
              echo "Ngrok connection successful"
              break
            else
              echo "Connection failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

      - name: Monitor ngrok during tests
        run: |
          cat > monitor_ngrok.sh << 'EOF'
          #!/bin/bash
          while true; do
            if ! kill -0 $NGROK_PID 2>/dev/null; then
              echo "WARNING: Ngrok process died, restarting..."
              ngrok http --hostname=${{ secrets.NGROK_CUSTOM_DOMAIN }} --log=stdout 80 > ngrok.log 2>&1 &
              NGROK_PID=$!
              echo "NGROK_PID=$NGROK_PID" >> $GITHUB_ENV
              sleep 5
            fi
            sleep 30
          done
          EOF
          
          chmod +x monitor_ngrok.sh
          ./monitor_ngrok.sh &
          echo "Ngrok monitor started for ${{ matrix.branch }}"

      - name: Install Playwright
        working-directory: source/test-module/tests/e2e/playwright
        run: |
          npm install dotenv --save-dev
          npm install
          npx playwright install

      - name: Create user
        run: |
          docker compose exec -T php bin/oe-console datagen:shop:create_user \
            --user-email ${{ secrets.SHOP_USER_EMAIL }} \
            --user-password ${{ secrets.SHOP_USER_PASSWORD }}

      - name: Run Playwright tests
        working-directory: source/test-module/tests/e2e/playwright
        run: |
          if ! kill -0 $NGROK_PID 2>/dev/null; then
            echo "Ngrok is not running, restarting..."
            ngrok http --hostname=${{ secrets.NGROK_CUSTOM_DOMAIN }} --log=stdout 80 > ngrok.log 2>&1 &
            NGROK_PID=$!
            sleep 10
          fi
          
          timeout 600 make test || {
            echo "Test timed out or failed for ${{ matrix.branch }}, checking ngrok status..."
            if kill -0 $NGROK_PID 2>/dev/null; then
              echo "Ngrok is still running"
            else
              echo "Ngrok died during test execution"
              cat ngrok.log
            fi
            exit 1
          }

      - name: Cleanup ngrok
        if: always()
        run: |
          if [[ -n "$NGROK_PID" ]] && kill -0 $NGROK_PID 2>/dev/null; then
            echo "Stopping ngrok process $NGROK_PID"
            kill $NGROK_PID
          fi
          
          pkill -f ngrok || true
          
          if [ -f ngrok.log ]; then
            echo "Ngrok logs for ${{ matrix.branch }}:"
            cat ngrok.log
          fi

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nightly-Playwright-${{ matrix.branch }}-${{ matrix.php }}-${{ matrix.mysql }}
          path: |
            source/test-module/tests/e2e/playwright/_generated/
            source/coverage.xml
            source/phpunit.xml
            source/source/log/oxideshop.log
            source/data/php/logs/error_log.txt

  notify-results:
    needs: [unit_tests, playwright]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on failure
        if: ${{ needs.unit_tests.result == 'failure' || needs.playwright.result == 'failure' }}
        run: |
          echo "Nightly tests failed for some configurations"
          echo "Unit tests result: ${{ needs.unit_tests.result }}"
          echo "Playwright tests result: ${{ needs.playwright.result }}"
          # Add notification logic here (email, Slack, etc.)

      - name: Notify on success
        if: ${{ needs.unit_tests.result == 'success' && needs.playwright.result == 'success' }}
        run: |
          echo "All nightly tests passed successfully"
          # Add success notification logic here
