# {{ $ids := "osc_paypal" }}ids: {{ $ids }}
# {{ $org := "oxid-solution-catalysts" }}organisation: {{ $org }}
# {{ $name := "paypal-module" }}name: {{ $name }}
# {{ $repo := "OXID-eSales/paypal-module" }}repo: {{ $repo }}

install_shop_with_modules:
  cache:
    prepared_shop: false
  composer:
    transform: |
      {
          "preferred-install": {
            "oxid-esales/*": "source",
            "oxid-professional-services/*": "source",
            "ddoe/*": "source"
          },
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-component": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/apex-theme": "{{ .Data.global.composer.dev_ref }}",
              "{{ $org }}/{{ $name }}": "{{ .Data.global.composer.ref_name }}"
          },
          "repositories": {
            "{{ $org }}/{{ $name }}": {
              "type": "git",
              "url": "https://github.com/{{ $repo }}.git"
            },
            "oxid-solution-catalysts/paypal-client": {
                "type": "git",
                "url": "https://github.com/OXID-eSales/paypal-client.git"
            },
            "oxid-solution-catalysts/paypal-module": {
                "type": "git",
                "url": "https://github.com/OXID-eSales/paypal-module.git"
            }
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:module:activate "{{ $ids }}"
    cp vendor/{{ $org }}/{{ $name }}/tests/.env.dist vendor/{{ $org }}/{{ $name }}/tests/.env
    cp vendor/{{ $org }}/{{ $name }}/recipe/environment/1.yaml /var/www/var/configuration/environment/shops/1/modules/osc_paypal.yaml 
    ./bin/oe-console oe:module:install extensions/paypal
    ./bin/oe-console oe:module:activate osc_paypal
    chmod +x vendor/{{ $org }}/{{ $name }}/.github/scripts/codestyle_check.sh
    composer require --dev mikey179/vfsstream --no-update
    composer require symfony/dotenv --no-update
    composer update --prefer-dist --no-interaction --no-progress

runscript: &runscript
  matrix:
    script: |
      [
        "osc_paypal:phpunit"
      ]
  osc_paypal:
    path: 'vendor/{{ $org}}/{{ $name }}'

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "osc_paypal:phpmd",
        "osc_paypal:phpcs",
        "osc_paypal:phpstan"
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/vendor/{{ print $org }}/{{ print $name}}/'
  project_key: 'OXID-eSales_{{ print $name }}'
  project_name: '{{ $org}}/{{ $name }}'
  parameters: |
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests
    -Donar.php.phpstan.reportPaths=coverage-reports/phpstan.report.json

finish:
  slack_title: '{{ print $name }} ({{ .Data.global.git.shop_ref }}) by {{ .Github.Actor }}'
