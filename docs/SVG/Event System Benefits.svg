<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1594px;height:209px;background:#FFFFFF;" width="1594px" height="209px" viewBox="0 0 1594 209" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="407"><text x="562.809" y="35.421" fill="#000" font-size="22" textLength="466.383" font-weight="700" font-family="Verdana">Benefits of Event-Driven Architecture</text></g><!--cluster Decoupling--><g class="cluster" data-qualified-name="Decoupling" id="ent0001" data-source-line="409"><path d="M13.5,57.609 L103.107,57.609 A3.75,3.75 0 0 1 105.607,60.109 L112.607,79.906 L338.5,79.906 A2.5,2.5 0 0 1 341,82.406 L341,191.769 A2.5,2.5 0 0 1 338.5,194.269 L13.5,194.269 A2.5,2.5 0 0 1 11,191.769 L11,60.109 A2.5,2.5 0 0 1 13.5,57.609" style="stroke:#000;stroke-width:1;" fill="#E6F2FF"/><line x1="11" y1="79.906" x2="112.607" y2="79.906" style="stroke:#000;stroke-width:1;"/><text x="15" y="72.604" fill="#000" font-size="14" textLength="88.607" font-weight="700" font-family="Verdana">Decoupling</text></g><!--cluster Extensibility--><g class="cluster" data-qualified-name="Extensibility" id="ent0003" data-source-line="419"><path d="M367.5,57.609 L466.616,57.609 A3.75,3.75 0 0 1 469.116,60.109 L476.116,79.906 L690.5,79.906 A2.5,2.5 0 0 1 693,82.406 L693,191.769 A2.5,2.5 0 0 1 690.5,194.269 L367.5,194.269 A2.5,2.5 0 0 1 365,191.769 L365,60.109 A2.5,2.5 0 0 1 367.5,57.609" style="stroke:#000;stroke-width:1;" fill="#FFE6E6"/><line x1="365" y1="79.906" x2="476.116" y2="79.906" style="stroke:#000;stroke-width:1;"/><text x="369" y="72.604" fill="#000" font-size="14" textLength="98.116" font-weight="700" font-family="Verdana">Extensibility</text></g><!--cluster Testability--><g class="cluster" data-qualified-name="Testability" id="ent0005" data-source-line="429"><path d="M719.5,57.609 L804.254,57.609 A3.75,3.75 0 0 1 806.754,60.109 L813.754,79.906 L976.5,79.906 A2.5,2.5 0 0 1 979,82.406 L979,191.769 A2.5,2.5 0 0 1 976.5,194.269 L719.5,194.269 A2.5,2.5 0 0 1 717,191.769 L717,60.109 A2.5,2.5 0 0 1 719.5,57.609" style="stroke:#000;stroke-width:1;" fill="#E6FFE6"/><line x1="717" y1="79.906" x2="813.754" y2="79.906" style="stroke:#000;stroke-width:1;"/><text x="721" y="72.604" fill="#000" font-size="14" textLength="83.754" font-weight="700" font-family="Verdana">Testability</text></g><!--cluster Maintainability--><g class="cluster" data-qualified-name="Maintainability" id="ent0007" data-source-line="439"><path d="M1005.5,57.609 L1125.233,57.609 A3.75,3.75 0 0 1 1127.733,60.109 L1134.733,79.906 L1278.5,79.906 A2.5,2.5 0 0 1 1281,82.406 L1281,191.769 A2.5,2.5 0 0 1 1278.5,194.269 L1005.5,194.269 A2.5,2.5 0 0 1 1003,191.769 L1003,60.109 A2.5,2.5 0 0 1 1005.5,57.609" style="stroke:#000;stroke-width:1;" fill="#FFF9E6"/><line x1="1003" y1="79.906" x2="1134.733" y2="79.906" style="stroke:#000;stroke-width:1;"/><text x="1007" y="72.604" fill="#000" font-size="14" textLength="118.733" font-weight="700" font-family="Verdana">Maintainability</text></g><!--cluster Flexibility--><g class="cluster" data-qualified-name="Flexibility" id="ent0009" data-source-line="449"><path d="M1307.5,57.609 L1386.423,57.609 A3.75,3.75 0 0 1 1388.923,60.109 L1395.923,79.906 L1576.5,79.906 A2.5,2.5 0 0 1 1579,82.406 L1579,191.769 A2.5,2.5 0 0 1 1576.5,194.269 L1307.5,194.269 A2.5,2.5 0 0 1 1305,191.769 L1305,60.109 A2.5,2.5 0 0 1 1307.5,57.609" style="stroke:#000;stroke-width:1;" fill="#F0E6FF"/><line x1="1305" y1="79.906" x2="1395.923" y2="79.906" style="stroke:#000;stroke-width:1;"/><text x="1309" y="72.604" fill="#000" font-size="14" textLength="77.923" font-weight="700" font-family="Verdana">Flexibility</text></g><g class="entity" data-qualified-name="Decoupling.N1" id="ent0002" data-source-line="411"><path d="M27.28,92.609 L27.28,178.273 L324.714,178.273 L324.714,102.609 L314.714,92.609 L27.28,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M314.714,92.609 L314.714,102.609 L324.714,102.609 L314.714,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="33.28" y="109.676" fill="#000" font-size="13" textLength="111.731" font-weight="700" font-family="Verdana">Loose Coupling</text><text x="33.28" y="124.809" fill="#000" font-size="13" textLength="275.844" font-family="Verdana">- Controllers don't know about subscribers</text><text x="33.28" y="139.942" fill="#000" font-size="13" textLength="276.434" font-family="Verdana">- Subscribers don't know about each other</text><text x="33.28" y="155.075" fill="#000" font-size="13" textLength="194.898" font-family="Verdana">- Easy to add new subscribers</text><text x="33.28" y="170.208" fill="#000" font-size="13" textLength="162.976" font-family="Verdana">- No direct dependencies</text></g><g class="entity" data-qualified-name="Extensibility.N2" id="ent0004" data-source-line="421"><path d="M380.75,92.609 L380.75,178.273 L677.251,178.273 L677.251,102.609 L667.251,92.609 L380.75,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M667.251,92.609 L667.251,102.609 L677.251,102.609 L667.251,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="386.75" y="109.676" fill="#000" font-size="13" textLength="110.322" font-weight="700" font-family="Verdana">Easy Extension</text><text x="386.75" y="124.809" fill="#000" font-size="13" textLength="234.889" font-family="Verdana">- Third-party modules can subscribe</text><text x="386.75" y="139.942" fill="#000" font-size="13" textLength="275.501" font-family="Verdana">- Add custom logic without modifying core</text><text x="386.75" y="155.075" fill="#000" font-size="13" textLength="205.988" font-family="Verdana">- Multiple subscribers per event</text><text x="386.75" y="170.208" fill="#000" font-size="13" textLength="167.362" font-family="Verdana">- Priority-based execution</text></g><g class="entity" data-qualified-name="Testability.N3" id="ent0006" data-source-line="431"><path d="M733.44,92.609 L733.44,178.273 L962.554,178.273 L962.554,102.609 L952.554,92.609 L733.44,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M952.554,92.609 L952.554,102.609 L962.554,102.609 L952.554,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="739.44" y="109.676" fill="#000" font-size="13" textLength="128.807" font-weight="700" font-family="Verdana">Improved Testing</text><text x="739.44" y="124.809" fill="#000" font-size="13" textLength="190.208" font-family="Verdana">- Test subscribers in isolation</text><text x="739.44" y="139.942" fill="#000" font-size="13" textLength="163.414" font-family="Verdana">- Mock event dispatchers</text><text x="739.44" y="155.075" fill="#000" font-size="13" textLength="208.114" font-family="Verdana">- Test event creation separately</text><text x="739.44" y="170.208" fill="#000" font-size="13" textLength="190.785" font-family="Verdana">- No integration tests needed</text></g><g class="entity" data-qualified-name="Maintainability.N4" id="ent0008" data-source-line="441"><path d="M1019.12,92.609 L1019.12,178.273 L1264.871,178.273 L1264.871,102.609 L1254.871,92.609 L1019.12,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1254.871,92.609 L1254.871,102.609 L1264.871,102.609 L1254.871,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="1025.12" y="109.676" fill="#000" font-size="13" textLength="143.857" font-weight="700" font-family="Verdana">Easier Maintenance</text><text x="1025.12" y="124.809" fill="#000" font-size="13" textLength="203.22" font-family="Verdana">- Single Responsibility Principle</text><text x="1025.12" y="139.942" fill="#000" font-size="13" textLength="195.793" font-family="Verdana">- Clear separation of concerns</text><text x="1025.12" y="155.075" fill="#000" font-size="13" textLength="224.751" font-family="Verdana">- Event names document behavior</text><text x="1025.12" y="170.208" fill="#000" font-size="13" textLength="166.404" font-family="Verdana">- Easy to trace event flow</text></g><g class="entity" data-qualified-name="Flexibility.N5" id="ent0010" data-source-line="451"><path d="M1321.22,92.609 L1321.22,178.273 L1562.782,178.273 L1562.782,102.609 L1552.782,92.609 L1321.22,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1552.782,92.609 L1552.782,102.609 L1562.782,102.609 L1552.782,92.609" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="1327.22" y="109.676" fill="#000" font-size="13" textLength="131.479" font-weight="700" font-family="Verdana">Flexible Workflow</text><text x="1327.22" y="124.809" fill="#000" font-size="13" textLength="203.169" font-family="Verdana">- Conditional event dispatching</text><text x="1327.22" y="139.942" fill="#000" font-size="13" textLength="220.562" font-family="Verdana">- Async event processing possible</text><text x="1327.22" y="155.075" fill="#000" font-size="13" textLength="207.029" font-family="Verdana">- Event queuing for heavy tasks</text><text x="1327.22" y="170.208" fill="#000" font-size="13" textLength="176.293" font-family="Verdana">- Retry logic per subscriber</text></g><?plantuml-src TPFVQzim4CVVyrVSkeT18B1rMs2FtMh3O2sZBUnPbYwnYAppf7CIC_Q_xsIxjfCi1cEa--7xtFVk3PTO8THEMRzOi6M7y1KzRYn7e0raU_IykWzMld0NT6aPDJS15ujQwPtQ8jpSewQcTjPlR-1jjivlynp-B40UJuoW8Zn-w8u0o-KFeeZmRGXOBWV3Iguy1t8EGmH3_Xt3pjC1L44DGsoAg8Cjn3W6F4ztbm6eT0aaS67qprHiWGcKCU3nyD-SZmJ61Y44WpLwWrvRxCrowdWMVsVesP7HHrjOPxaL-ZpFrjdwdFvsfEzg68B8p-XVIXlCgbQ1MwZ8D0uZQEMd8aVFEobVDv6f0aTRg-5WkKp84cOthJGLD8N9_w5nR6kHTSOBDGR09EtezZDO2WAnAbH40tX4tR3KU9tz1IEhaLnqpo_9Fuxatwiwq5uofx1JvTFDINNMWutarFZ_ZeFqhgzP98grObtEbUkIz6OTi0k5YD9GnUZQkS3MCsv3xy4I5MKQqA2vJleWoy7ogfdE-PTBsazpdQsqk0j4hxp66U-pu8iUJnXh6eSd2I339a9D6-5GXLU8LAtieoR95Vp4tIqeU5LXsWBTLEbOOAdsekV5x7DG6eSsRHmThZFd3e-pkNwVz3td_Jpozju2zOl2BYK-NMnZK_tAdUadVPZ6EhPU3tQP58qnfb6kIRx5h2azx-y6csJUK80IrLxWLDnDNNb23ksm7sdMf-aw9_u7?></g></svg>