y="72.6045">Extensibility</text></g><!--cluster Testability--><g class="cluster" data-entity="Testability" data-source-line="429" data-uid="ent0006" id="cluster_Testability"><path d="M719.5,57.6094 L804.2539,57.6094 A3.75,3.75 0 0 1 806.7539,60.1094 L813.7539,79.9063 L976.5,79.9063 A2.5,2.5 0 0 1 979,82.4063 L979,191.7694 A2.5,2.5 0 0 1 976.5,194.2694 L719.5,194.2694 A2.5,2.5 0 0 1 717,191.7694 L717,60.1094 A2.5,2.5 0 0 1 719.5,57.6094" fill="#E6FFE6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="717" x2="813.7539" y1="79.9063" y2="79.9063"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="83.7539" x="721" y="72.6045">Testability</text></g><!--cluster Maintainability--><g class="cluster" data-entity="Maintainability" data-source-line="439" data-uid="ent0008" id="cluster_Maintainability"><path d="M1005.5,57.6094 L1125.2334,57.6094 A3.75,3.75 0 0 1 1127.7334,60.1094 L1134.7334,79.9063 L1278.5,79.9063 A2.5,2.5 0 0 1 1281,82.4063 L1281,191.7694 A2.5,2.5 0 0 1 1278.5,194.2694 L1005.5,194.2694 A2.5,2.5 0 0 1 1003,191.7694 L1003,60.1094 A2.5,2.5 0 0 1 1005.5,57.6094" fill="#FFF9E6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="1003" x2="1134.7334" y1="79.9063" y2="79.9063"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="118.7334" x="1007" y="72.6045">Maintainability</text></g><!--cluster Flexibility--><g class="cluster" data-entity="Flexibility" data-source-line="449" data-uid="ent0010" id="cluster_Flexibility"><path d="M1307.5,57.6094 L1386.4229,57.6094 A3.75,3.75 0 0 1 1388.9229,60.1094 L1395.9229,79.9063 L1576.5,79.9063 A2.5,2.5 0 0 1 1579,82.4063 L1579,191.7694 A2.5,2.5 0 0 1 1576.5,194.2694 L1307.5,194.2694 A2.5,2.5 0 0 1 1305,191.7694 L1305,60.1094 A2.5,2.5 0 0 1 1307.5,57.6094" fill="#F0E6FF" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="1305" x2="1395.9229" y1="79.9063" y2="79.9063"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="77.9229" x="1309" y="72.6045">Flexibility</text></g><g class="entity" data-entity="N1" data-source-line="411" data-uid="ent0003" id="entity_N1"><path d="M27.28,92.6094 L27.28,178.2734 L324.7141,178.2734 L324.7141,102.6094 L314.7141,92.6094 L27.28,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M314.7141,92.6094 L314.7141,102.6094 L324.7141,102.6094 L314.7141,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.7314" x="33.28" y="109.6763">Loose Coupling</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="275.8438" x="33.28" y="124.8091">- Controllers don't know about subscribers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="276.4341" x="33.28" y="139.9419">- Subscribers don't know about each other</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="194.8984" x="33.28" y="155.0747">- Easy to add new subscribers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="162.9761" x="33.28" y="170.2075">- No direct dependencies</text></g><g class="entity" data-entity="N2" data-source-line="421" data-uid="ent0005" id="entity_N2"><path d="M380.75,92.6094 L380.75,178.2734 L677.251,178.2734 L677.251,102.6094 L667.251,92.6094 L380.75,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M667.251,92.6094 L667.251,102.6094 L677.251,102.6094 L667.251,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.3223" x="386.75" y="109.6763">Easy Extension</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="234.8887" x="386.75" y="124.8091">- Third-party modules can subscribe</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="275.501" x="386.75" y="139.9419">- Add custom logic without modifying core</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.9878" x="386.75" y="155.0747">- Multiple subscribers per event</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="167.3623" x="386.75" y="170.2075">- Priority-based execution</text></g><g class="entity" data-entity="N3" data-source-line="431" data-uid="ent0007" id="entity_N3"><path d="M733.44,92.6094 L733.44,178.2734 L962.5543,178.2734 L962.5543,102.6094 L952.5543,92.6094 L733.44,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M952.5543,92.6094 L952.5543,102.6094 L962.5543,102.6094 L952.5543,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.8066" x="739.44" y="109.6763">Improved Testing</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="190.2075" x="739.44" y="124.8091">- Test subscribers in isolation</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="163.4141" x="739.44" y="139.9419">- Mock event dispatchers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="208.1143" x="739.44" y="155.0747">- Test event creation separately</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="190.7852" x="739.44" y="170.2075">- No integration tests needed</text></g><g class="entity" data-entity="N4" data-source-line="441" data-uid="ent0009" id="entity_N4"><path d="M1019.12,92.6094 L1019.12,178.2734 L1264.8715,178.2734 L1264.8715,102.6094 L1254.8715,92.6094 L1019.12,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1254.8715,92.6094 L1254.8715,102.6094 L1264.8715,102.6094 L1254.8715,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="143.8569" x="1025.12" y="109.6763">Easier Maintenance</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="203.2202" x="1025.12" y="124.8091">- Single Responsibility Principle</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.7935" x="1025.12" y="139.9419">- Clear separation of concerns</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="224.7515" x="1025.12" y="155.0747">- Event names document behavior</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="166.4038" x="1025.12" y="170.2075">- Easy to trace event flow</text></g><g class="entity" data-entity="N5" data-source-line="451" data-uid="ent0011" id="entity_N5"><path d="M1321.22,92.6094 L1321.22,178.2734 L1562.782,178.2734 L1562.782,102.6094 L1552.782,92.6094 L1321.22,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1552.782,92.6094 L1552.782,102.6094 L1562.782,102.6094 L1552.782,92.6094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.479" x="1327.22" y="109.6763">Flexible Workflow</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="203.1694" x="1327.22" y="124.8091">- Conditional event dispatching</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="220.562" x="1327.22" y="139.9419">- Async event processing possible</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="207.0288" x="1327.22" y="155.0747">- Event queuing for heavy tasks</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="176.2935" x="1327.22" y="170.2075">- Retry logic per subscriber</text></g><!--SRC=[TPFVQzim4CVVyrVSkeT18B1rMs2FtMh3O2sZBUnPbYwnYAppf7CIC_Q_xsIxjfCi1cEa- -7xtFVk3PTO8THEMRzOi6M7y1KzRYn7e0raU_IykWzMld0NT6aPDJS15ujQwPtQ8jpSewQcTjPlR-1jjivlynp-B40UJuoW8Zn-w8u0o-KFeeZmRGXOBWV3Iguy1t8EGmH3_Xt3pjC1L44DGsoAg8Cjn3W6F4ztbm6eT0aaS67qprHiWGcKCU3nyD-SZmJ61Y44WpLwWrvRxCrowdWMVsVesP7HHrjOPxaL-ZpFrjdwdFvsfEzg68B8p-XVIXlCgbQ1MwZ8D0uZQEMd8aVFEobVDv6f0aTRg-5WkKp84cOthJGLD8N9_w5nR6kHTSOBDGR09EtezZDO2WAnAbH40tX4tR3KU9tz1IEhaLnqpo_9Fuxatwiwq5uofx1JvTFDINNMWutarFZ_ZeFqhgzP98grObtEbUkIz6OTi0k5YD9GnUZQkS3MCsv3xy4I5MKQqA2vJleWoy7ogfdE-PTBsazpdQsqk0j4hxp66U-pu8iUJnXh6eSd2I339a9D6-5GXLU8LAtieoR95Vp4tIqeU5LXsWBTLEbOOAdsekV5x7DG6eSsRHmThZFd3e-pkNwVz3td_Jpozju2zOl2BYK-NMnZK_tAdUadVPZ6EhPU3tQP58qnfb6kIRx5h2azx-y6csJUK80IrLxWLDnDNNb23ksm7sdMf-aw9_u7]--></g></svg>